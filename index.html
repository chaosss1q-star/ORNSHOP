<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORNSHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .modal-animate { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-rose-600">ORNSHOP</h1>
            <p class="text-sm text-gray-500">รวมสินค้าคุณภาพ</p>
        </div>
    </nav>

    <header class="bg-pink-300 text-white py-16 px-6 text-center">
        <h2 class="text-4xl font-bold mb-4">ยินดีต้อนรับสู่ร้านค้าของเรา</h2>
        <p class="text-indigo-100 max-w-2xl mx-auto">เลือกดูสินค้าและกดดูรายละเอียดเพื่อเลือกวิธีการจัดส่งและสั่งซื้อผ่าน Line ได้ทันที</p>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            </div>
    </main>

    <div id="productModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden relative shadow-2xl modal-animate">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-3xl z-10">&times;</button>
            
            <div class="flex flex-col md:flex-row">
                <div class="md:w-1/2 bg-gray-200">
                    <img id="modalImg" src="" class="w-full h-72 md:h-full object-cover">
                </div>
                
                <div class="p-8 md:w-1/2 flex flex-col justify-between">
                    <div>
                        <h2 id="modalName" class="text-3xl font-bold text-gray-800 mb-2"></h2>
                        <p id="modalPrice" class="text-2xl text-indigo-600 font-bold mb-4"></p>
                        <div class="bg-gray-50 p-4 rounded-xl mb-6">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">รายละเอียดสินค้า</p>
                            <p id="modalDesc" class="text-gray-600 text-sm leading-relaxed"></p>
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-3">🚚 เลือกวิธีการจัดส่ง:</label>
                            <div id="shippingOptions" class="space-y-2 text-sm">
                                </div>
                        </div>
                    </div>

                    <button onclick="orderViaLine()" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl font-bold text-lg transition-all shadow-lg hover:shadow-green-200 flex justify-center items-center gap-2">
                        <span>สั่งซื้อผ่าน Line</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t py-10 text-center text-gray-500">
        <p>© 2026 My Shop. All rights reserved.</p>
    </footer>

    <script>
        // ข้อมูลสินค้า (ตรวจสอบ ID ไม่ให้ซ้ำกัน)
        const products = [
            { id: 1, name: "เมาส์สุดเท่", price: "35000", desc: "ใช้เเล้วก็เหมือนเดิมไม่ได้เก่ง", img: "https://th.bing.com/th/id/R.501923b214bc009c1ee4584f8b0d2e73?rik=pCZR4vGbwuaemg&riu=http%3a%2f%2fmicemod.gg%2fcdn%2fshop%2ffiles%2fUntitled-2_1200x1200.webp%3fv%3d1758355647&ehk=ZyB%2bh6uNisGUlExE%2f%2f2xLxz2VqsfgbFELxdjqb6LUi0%3d&risl=&pid=ImgRaw&r=0" ,ship: ["ส่งด่วน +50"] },
            { id: 2, name: "คีบอร์ดสุดหรู", price: "45000", desc: "มีไฟสว่างเหมือนอยู่โรงลิเก", img: "https://tse2.mm.bing.net/th/id/OIP.JnUiLiCGeeX62rRIh1Y3aAHaHa?cb=defcache2&defcache=1&w=493&h=493&rs=1&pid=ImgDetMain&o=7&rm=3" , ship: ["ส่งด่วน +50","รับหน้าร้านฟรี"] },
            { id: 3, name: "จอยเกมสุดเฟี้ยว", price: "29000", desc: "ก็เเค่จอยเล่นเกมใกล้พัง", img: "https://tse4.mm.bing.net/th/id/OIP.ba4IBAcF6fNJfAZlaoQRTwHaFW?cb=defcache2&defcache=1&rs=1&pid=ImgDetMain&o=7&rm=3" , ship: ["ส่งด่วน +50","รับหน้าร้านฟรี"] },
            { id: 4, name: "เเผ่นรองเมาส์ค่ตเท่", price: "10000", desc: "เเผ่นรองเมาส์ไม่มีไรมาก", img: "https://th.bing.com/th/id/R.4ed20d04dafc62a0dbc346b3a4ea8595?rik=4RfZCntQxOUrQA&riu=http%3a%2f%2f5.imimg.com%2fdata5%2fSELLER%2fDefault%2f2024%2f5%2f418322742%2fMY%2fFA%2fHE%2f110573180%2fwrist-support-mouse-pad-3-1000x1000.jpg&ehk=hnXx3VWoaKQ806pJw6%2fG4NNCDDFvCIxk23Zd6mPqIF8%3d&risl=&pid=ImgRaw&r=0",ship: ["ส่งด่วน +50","รับหน้าร้านฟรี"] },
            { id: 5, name: "สินค้าชิ้นที่ 5", price: "490", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 5 ดีไซน์ทันสมัย เหมาะกับทุกคน", img: "https://via.placeholder.com/600x600", ship: ["ส่งด่วน +50","รับหน้าร้านฟรี"] },
            { id: 6, name: "สินค้าชิ้นที่ 6", price: "990", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 6 ทนทานต่อการใช้งานหนัก", img: "https://via.placeholder.com/600x600", ship: ["Flash Express +50","รับหน้าร้านฟรี"] },
            { id: 7, name: "สินค้าชิ้นที่ 7", price: "1,500", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 7 สินค้านำเข้าจากต่างประเทศ", img: "https://via.placeholder.com/600x600", ship: ["ส่งฟรีทั่วไทย","รับหน้าร้านฟรี"] },
            { id: 8, name: "สินค้าชิ้นที่ 8", price: "290", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 8 ของแท้ 100% มีจำนวนจำกัด", img: "https://via.placeholder.com/600x600", ship: ["ส่งลงทะเบียน +30","รับหน้าร้านฟรี"] },
            { id: 9, name: "สินค้าชิ้นที่ 9", price: "720", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 9 ยอดนิยมอันดับ 1 ในขณะนี้", img: "https://via.placeholder.com/600x600", ship: ["Flash Express +50","รับหน้าร้านฟรี"] },
            { id: 10, name: "สินค้าชิ้นที่ 10", price: "2,500", desc: "รายละเอียดสินค้าคุณภาพชิ้นที่ 10 หรูหรา เหมาะสำหรับเป็นของขวัญ", img: "https://via.placeholder.com/600x600", ship: ["ส่งฟรี", "EMS +50","รับหน้าร้านฟรี"] }
        ];

        // แสดงผลสินค้าหน้าหลัก
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map(p => `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 group cursor-pointer" onclick="openModal(${p.id})">
                <div class="relative overflow-hidden">
                    <img src="${p.img}" class="w-full h-64 object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute bottom-3 right-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-indigo-600 shadow">คลิกดูรายละเอียด</div>
                </div>
                <div class="p-5">
                    <h3 class="font-semibold text-gray-800 text-lg mb-1">${p.name}</h3>
                    <p class="text-indigo-600 font-bold">฿${p.price}</p>
                </div>
            </div>
        `).join('');

        // ฟังก์ชันจัดการ Modal
        function openModal(id) {
            const p = products.find(item => item.id === id);
            document.getElementById('modalName').innerText = p.name;
            document.getElementById('modalPrice').innerText = '฿' + p.price;
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalImg').src = p.img;

            // สร้างตัวเลือกการจัดส่ง
            const shipDiv = document.getElementById('shippingOptions');
            shipDiv.innerHTML = p.ship.map((s, i) => `
                <label class="flex items-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition">
                    <input type="radio" name="shipOption" value="${s}" ${i===0?'checked':''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-3 text-gray-700">${s}</span>
                </label>
            `).join('');

            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function orderViaLine() {
            const name = document.getElementById('modalName').innerText;
            const price = document.getElementById('modalPrice').innerText;
            const shipping = document.querySelector('input[name="shipOption"]:checked').value;
            
            // --- แก้ไขตรงนี้: ใส่ LINE ID ของคุณแทนคำว่า YOUR_ID ---
            const lineId = "noaw0983239545"; 
            
            const text = `สั่งซื้อสินค้า: ${name}\nราคา: ${price}\nการจัดส่ง: ${shipping}`;
            const url = `https://line.me/R/oaMessage/${lineId}/?${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
